apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-v1

spec:
  replicas: 9

  selector:
    matchLabels:
      app: flask
      version: v1

  template:
    metadata:
      labels:
        app: flask
        version: v1

    spec:
      containers:
      - name: flask
        image: flask-demo:v1

        ports:
        - containerPort: 5000
