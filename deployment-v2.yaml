apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-v2

spec:
  replicas: 1

  selector:
    matchLabels:
      app: flask
      version: v2

  template:
    metadata:
      labels:
        app: flask
        version: v2

    spec:
      containers:
      - name: flask
        image: flask-demo:v2

        ports:
        - containerPort: 5000
